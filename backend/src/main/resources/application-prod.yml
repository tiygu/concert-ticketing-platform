spring:
  datasource:
    url: jdbc:mysql://prod-mysql-host:3306/concert_ticketing?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: ${DB_USERNAME:concert_user}
    password: ${DB_PASSWORD:concert_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  sql:
    init:
      mode: never

# 生产环境关闭 Swagger（或可通过配置开启）
knife4j:
  enable: ${KNIFE4J_ENABLE:false}

# 生产环境日志级别
logging:
  level:
    root: WARN
    com.concert.ticketing: INFO
    org.springframework.security: WARN
